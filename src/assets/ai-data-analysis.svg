<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="data-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-effect">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Grid -->
  <g stroke="#3B82F6" stroke-width="0.5" opacity="0.2">
    <g id="vertical-lines">
      <line x1="100" y1="100" x2="100" y2="500"/>
      <line x1="200" y1="100" x2="200" y2="500"/>
      <line x1="300" y1="100" x2="300" y2="500"/>
      <line x1="400" y1="100" x2="400" y2="500"/>
      <line x1="500" y1="100" x2="500" y2="500"/>
      <line x1="600" y1="100" x2="600" y2="500"/>
      <line x1="700" y1="100" x2="700" y2="500"/>
    </g>
    <g id="horizontal-lines">
      <line x1="100" y1="100" x2="700" y2="100"/>
      <line x1="100" y1="200" x2="700" y2="200"/>
      <line x1="100" y1="300" x2="700" y2="300"/>
      <line x1="100" y1="400" x2="700" y2="400"/>
      <line x1="100" y1="500" x2="700" y2="500"/>
    </g>
  </g>
  
  <!-- Data Points and Connections -->
  <g>
    <!-- Data points -->
    <circle cx="150" cy="450" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    <circle cx="250" cy="350" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    <circle cx="350" cy="200" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    <circle cx="450" cy="300" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    <circle cx="550" cy="150" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    <circle cx="650" cy="250" r="5" fill="url(#data-gradient)" filter="url(#glow-effect)"/>
    
    <!-- Connecting lines -->
    <path d="M150,450 L250,350 L350,200 L450,300 L550,150 L650,250" 
          stroke="url(#data-gradient)" 
          stroke-width="2" 
          fill="none"
          filter="url(#glow-effect)"/>
  </g>
  
  <!-- Animated Analysis Elements -->
  <g>
    <!-- Scanning line -->
    <line x1="100" y1="300" x2="700" y2="300" 
          stroke="#10B981" 
          stroke-width="2"
          opacity="0.5">
      <animate attributeName="y1" values="100;500;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100;500;100" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <!-- Data particles -->
    <g>
      <circle cx="400" cy="300" r="3" fill="#3B82F6">
        <animate attributeName="cx" values="100;700;100" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="400" r="3" fill="#10B981">
        <animate attributeName="cx" values="700;100;700" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg> 