<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50E3C2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Brain outline -->
  <path d="M400,100 C550,100 650,250 650,400 C650,550 550,600 400,600 C250,600 150,550 150,400 C150,250 250,100 400,100" 
        fill="none" stroke="url(#brain-gradient)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Circuit paths -->
  <g stroke="url(#brain-gradient)" stroke-width="2" fill="none">
    <path d="M200,300 L600,300" />
    <path d="M300,200 L300,400" />
    <path d="M500,200 L500,400" />
    <circle cx="300" cy="300" r="5" fill="#50E3C2"/>
    <circle cx="500" cy="300" r="5" fill="#50E3C2"/>
    <circle cx="400" cy="250" r="5" fill="#50E3C2"/>
    <circle cx="400" cy="350" r="5" fill="#50E3C2"/>
  </g>
  
  <!-- Data points -->
  <g fill="#4A90E2">
    <circle cx="250" cy="250" r="3"/>
    <circle cx="350" cy="350" r="3"/>
    <circle cx="450" cy="250" r="3"/>
    <circle cx="550" cy="350" r="3"/>
  </g>
  
  <!-- Pulse animation -->
  <circle cx="400" cy="300" r="10" fill="#50E3C2" opacity="0.5">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg> 