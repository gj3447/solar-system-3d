<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- 물체들 -->
  <g transform="translate(100,50)">
    <!-- 박스 1 -->
    <rect x="50" y="50" width="200" height="150" fill="#e2e8f0" stroke="#4f46e5" stroke-width="3"/>
    <rect x="50" y="20" width="80" height="25" fill="#4f46e5" rx="5"/>
    <text x="60" y="37" fill="white" font-family="Arial" font-size="14">Box 98%</text>
    
    <!-- 박스 2 -->
    <rect x="300" y="100" width="150" height="200" fill="#e2e8f0" stroke="#6366f1" stroke-width="3"/>
    <rect x="300" y="70" width="100" height="25" fill="#6366f1" rx="5"/>
    <text x="310" y="87" fill="white" font-family="Arial" font-size="14">Cylinder 95%</text>
    
    <!-- 박스 3 -->
    <rect x="500" y="150" width="180" height="120" fill="#e2e8f0" stroke="#818cf8" stroke-width="3"/>
    <rect x="500" y="120" width="90" height="25" fill="#818cf8" rx="5"/>
    <text x="510" y="137" fill="white" font-family="Arial" font-size="14">Part 92%</text>
  </g>
  
  <!-- 그리드 라인 -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
</svg> 