<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- 시스템 구성도 -->
  <g transform="translate(50,50)">
    <!-- RealSense 카메라 -->
    <g transform="translate(50,50)">
      <rect width="150" height="80" rx="10" fill="#6366f1"/>
      <text x="75" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">RealSense</text>
    </g>
    
    <!-- YOLO 처리 -->
    <g transform="translate(300,20)">
      <rect width="200" height="60" rx="10" fill="#4f46e5"/>
      <text x="100" y="35" font-family="Arial" font-size="14" fill="white" text-anchor="middle">YOLO 객체 감지</text>
    </g>
    
    <!-- Anomalib 처리 -->
    <g transform="translate(300,100)">
      <rect width="200" height="60" rx="10" fill="#4f46e5"/>
      <text x="100" y="35" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Anomalib 이상 감지</text>
    </g>
    
    <!-- 로봇 제어 시스템 -->
    <g transform="translate(600,50)">
      <rect width="150" height="80" rx="10" fill="#818cf8"/>
      <text x="75" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">로봇 제어</text>
    </g>
    
    <!-- 연결선 -->
    <g stroke="#4b5563" stroke-width="2">
      <!-- RealSense to YOLO -->
      <line x1="200" y1="90" x2="300" y2="50"/>
      <!-- RealSense to Anomalib -->
      <line x1="200" y1="90" x2="300" y2="130"/>
      <!-- YOLO to Robot -->
      <line x1="500" y1="50" x2="600" y2="90"/>
      <!-- Anomalib to Robot -->
      <line x1="500" y1="130" x2="600" y2="90"/>
    </g>
    
    <!-- 데이터 흐름 표시 -->
    <g>
      <circle cx="250" y1="70" r="5" fill="#4f46e5">
        <animate attributeName="cx" values="200;290;200" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="550" y1="70" r="5" fill="#818cf8">
        <animate attributeName="cx" values="500;590;500" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- 설명 텍스트 -->
  <text x="400" y="350" font-family="Arial" font-size="16" fill="#1e293b" text-anchor="middle">
    실시간 AI-로봇 통합 시스템
  </text>
  <text x="400" y="375" font-family="Arial" font-size="14" fill="#4b5563" text-anchor="middle">
    ROS2 기반 데이터 처리 및 제어 파이프라인
  </text>
</svg> 